<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SikaBook has moved</title>
<script>
// Remove the old saved copy of the app from this address so it cannot open from here any more.
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));}
if(window.caches){caches.keys().then(ks=>ks.forEach(k=>caches.delete(k)));}
</script></head>
<body style="font-family:system-ui,sans-serif;padding:32px;max-width:520px;margin:auto;line-height:1.5">
<h2>SikaBook has a new address</h2>
<p>This old address no longer works. Please use:</p>
<p style="font-size:20px"><a href="https://sikabook.github.io/"><b>https://sikabook.github.io</b></a></p>
<p>On your phone, remove the old SikaBook icon from your home screen, open the new address and choose “Add to Home Screen”.</p>
</body></html>
